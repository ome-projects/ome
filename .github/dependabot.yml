version: 2
updates:
  # Main Go module
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "go"
    groups:
      k8s:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      prometheus:
        patterns:
          - "github.com/prometheus/*"
    ignore:
      # Ignore major/minor K8s updates to maintain compatibility
      - dependency-name: "k8s.io/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sigs.k8s.io/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # KEDA tracks the k8s minor: its controller-runtime floor moves with
      # each minor, so standalone bumps resolve an incompatible module graph.
      # KEDA minors ride the k8s matrix migration instead.
      - dependency-name: "github.com/kedacore/keda/v2"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Tools Go module
  - package-ecosystem: "gomod"
    directory: "/hack/internal/tools"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "go"
      - "tools"

  # site/go.mod is intentionally absent: Dependabot tidies Go modules after
  # an update, and tidying deletes the Hugo-only Docsy requirement. Upgrade
  # Docsy by hand with `hugo mod get` (see site/go.mod).

  # NPM dependencies for documentation site
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "documentation"
      - "javascript"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/dockerfiles"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "docker"
