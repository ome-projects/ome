name: Alfred Scheduler Simulator

on:
  pull_request:
    branches: [ main, release-* ]
    types: [ opened, synchronize, reopened ]
    paths:
      - '.github/workflows/alfred-simulator.yml'
      - 'pkg/alfred/scheduling/**'
      - 'pkg/alfred/simulator/**'
      - 'scheduler/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [ main, release-* ]
    paths:
      - '.github/workflows/alfred-simulator.yml'
      - 'pkg/alfred/scheduling/**'
      - 'pkg/alfred/simulator/**'
      - 'scheduler/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Test, Vet, and Build Simulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            pkg/alfred/simulator/go.sum
            scheduler/go.sum

      - name: Test nested module with race detector
        working-directory: pkg/alfred/simulator
        run: go test -race ./...

      - name: Vet nested module
        working-directory: pkg/alfred/simulator
        run: go vet ./...

      - name: Build simulator
        working-directory: pkg/alfred/simulator
        run: go build ./cmd/alfred-simulator

      - name: Test root wire compatibility
        run: go test ./pkg/alfred/scheduling

      - name: Test predictive inputs against simulator
        env:
          ALFRED_SIMULATOR_BINARY: ${{ github.workspace }}/pkg/alfred/simulator/alfred-simulator
        run: go test -race ./pkg/alfred/scheduling/input
