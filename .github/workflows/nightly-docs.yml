name: Nightly Documentation Updates

on:
  schedule:
    - cron: '23 9 * * *' # 09:23 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

# Serialize the entire run, including publication. A retry must not race another
# planner over the same gaps. Every run rechecks live PRs before publishing.
concurrency:
  group: nightly-docs
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'ome-projects/ome'
    runs-on: ome-runner-cpu
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nightly-docs-setup
      - name: Gather code history and existing documentation PRs
        env:
          NIGHTLY_CONTEXT: ${{ runner.temp }}/nightly-docs-context.json
        run: |
          python3 hack/nightly-docs/nightly_docs.py context
      - name: Identify separate documentation concerns
        id: discover
        uses: anthropics/claude-code-action@v1
        env:
          NIGHTLY_CONTEXT: ${{ runner.temp }}/nightly-docs-context.json
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: Read and follow hack/nightly-docs/plan.md. The context file is ${{ runner.temp }}/nightly-docs-context.json.
          claude_args: >-
            --model claude-fable-5
            --effort xhigh
            --max-turns 60
            --tools "Read,Glob,Grep"
            --allowedTools "Read,Glob,Grep"
            --json-schema '{"type":"object","additionalProperties":false,"properties":{"concerns":{"type":"array","maxItems":100,"items":{"type":"object","additionalProperties":false,"properties":{"area":{"type":"string"},"concern":{"type":"string"},"source_sha":{"type":"string"},"title":{"type":"string"},"question":{"type":"string"},"evidence":{"type":"string"},"doc_paths":{"type":"array","minItems":1,"items":{"type":"string"}}},"required":["area","concern","source_sha","title","question","evidence","doc_paths"]}}},"required":["concerns"]}'
      - name: Validate plan and remove duplicate concerns
        id: plan
        env:
          NIGHTLY_CONTEXT: ${{ runner.temp }}/nightly-docs-context.json
          PLAN_JSON: ${{ steps.discover.outputs.structured_output }}
        run: python3 hack/nightly-docs/nightly_docs.py plan
      - name: Planning summary
        env:
          COUNT: ${{ steps.plan.outputs.count }}
        run: echo "Selected ${COUNT} separate documentation concerns (maximum 100)." >> "$GITHUB_STEP_SUMMARY"

  write:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ome-runner-cpu
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: 'Document: ${{ matrix.concern }}'
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ needs.plan.outputs.base_sha }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      ITEM_JSON: ${{ toJSON(matrix) }}
    steps:
      # Every concern starts from the same clean default-branch snapshot, never
      # from another documentation PR's branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nightly-docs-setup
      - name: Save the single concern
        env:
          NIGHTLY_ITEM: ${{ runner.temp }}/nightly-docs-item.json
        run: |
          python3 hack/nightly-docs/nightly_docs.py evidence
      - name: Update documentation for this concern only
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: Read and follow hack/nightly-docs/write.md. NIGHTLY_ITEM is ${{ runner.temp }}/nightly-docs-item.json; the source commit diff is ${{ runner.temp }}/nightly-docs-source.patch.
          claude_args: >-
            --model claude-fable-5
            --effort xhigh
            --max-turns 40
            --tools "Read,Glob,Grep,Edit,Write"
            --allowedTools "Read,Glob,Grep,Edit,Write"
      - name: Export untrusted documentation data
        env:
          BUNDLE_PATH: ${{ runner.temp }}/nightly-docs-bundle.json
        run: python3 hack/nightly-docs/nightly_docs.py export
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-docs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/nightly-docs-bundle.json
          if-no-files-found: error
          overwrite: true
          retention-days: 2

  publish:
    needs: [plan, write]
    # Successful writers can publish even when another matrix item fails.
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ome-runner-cpu
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: 'Validate and publish: ${{ matrix.concern }}'
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ needs.plan.outputs.base_sha }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      ITEM_JSON: ${{ toJSON(matrix) }}
    steps:
      # Only data crosses the job boundary. No writer scripts, Git metadata,
      # hooks, config, or review verdicts are reused in this privileged job.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nightly-docs-setup
      - name: Find this concern's artifact
        id: artifact
        env:
          ARTIFACT_NAME: nightly-docs-${{ strategy.job-index }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --paginate \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false) | .id")
          if [ -n "$ids" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Writer produced no artifact for this concern; no PR created." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v5
        if: steps.artifact.outputs.found == 'true'
        with:
          name: nightly-docs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/nightly-docs-incoming
      - name: Validate and import documentation data with pristine guards
        if: steps.artifact.outputs.found == 'true'
        id: scope
        env:
          BUNDLE_PATH: ${{ runner.temp }}/nightly-docs-incoming/nightly-docs-bundle.json
          NIGHTLY_ITEM: ${{ runner.temp }}/nightly-docs-item.json
        run: |
          python3 hack/nightly-docs/nightly_docs.py evidence
          python3 hack/nightly-docs/nightly_docs.py import
          git -c core.hooksPath=/dev/null diff --cached --no-ext-diff --no-textconv > "$RUNNER_TEMP/nightly-docs-review.patch"
      - name: Independently review accuracy and scope
        if: steps.scope.outputs.changed == 'true'
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: Read and follow hack/nightly-docs/review.md. NIGHTLY_ITEM is ${{ runner.temp }}/nightly-docs-item.json. Read ${{ runner.temp }}/nightly-docs-review.patch and ${{ runner.temp }}/nightly-docs-source.patch.
          claude_args: >-
            --model claude-fable-5
            --effort xhigh
            --max-turns 30
            --tools "Read,Glob,Grep"
            --allowedTools "Read,Glob,Grep"
            --json-schema '{"type":"object","additionalProperties":false,"properties":{"single_concern":{"type":"boolean"},"accurate":{"type":"boolean"},"reason":{"type":"string"}},"required":["single_concern","accurate","reason"]}'
      - name: Require a passing review
        if: steps.scope.outputs.changed == 'true'
        env:
          REVIEW_JSON: ${{ steps.review.outputs.structured_output }}
        run: |
          python3 -c 'import os, sys; sys.path.insert(0, "hack/nightly-docs"); from nightly_docs import review_passes; review_passes(os.environ["REVIEW_JSON"])'
      - uses: actions/setup-go@v6
        if: steps.scope.outputs.changed == 'true'
        with:
          go-version: '1.26'
          cache-dependency-path: hack/internal/tools/go.sum
      - uses: actions/setup-node@v6
        if: steps.scope.outputs.changed == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the documentation site
        if: steps.scope.outputs.changed == 'true'
        env:
          HUGO_ENVIRONMENT: production
          HUGO_BASEURL: https://ome-projects.github.io/ome/
        run: |
          (cd hack/internal/tools && GOBIN="$RUNNER_TEMP/nightly-docs-bin" CGO_ENABLED=1 go install -tags extended github.com/gohugoio/hugo@v0.157.0)
          # Hugo resolves Docsy modules into go.mod/go.sum. Build a copy so those
          # generated files cannot contaminate the strictly docs-only PR.
          cp -a site "$RUNNER_TEMP/nightly-docs-site"
          (cd "$RUNNER_TEMP/nightly-docs-site" && npm ci && "$RUNNER_TEMP/nightly-docs-bin/hugo" --gc --minify --enableGitInfo=false)
      - name: Publish one documentation PR
        if: steps.scope.outputs.changed == 'true'
        env:
          REVIEW_JSON: ${{ steps.review.outputs.structured_output }}
        run: |
          gh auth setup-git
          python3 hack/nightly-docs/nightly_docs.py publish
      - name: No-op summary
        if: steps.scope.outputs.changed == 'false'
        run: echo "No supported documentation change remained for this concern; no PR created." >> "$GITHUB_STEP_SUMMARY"
