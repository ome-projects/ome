name: Nightly Documentation Updates

on:
  schedule:
    - cron: '23 9 * * *' # 09:23 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate discovery and documentation edits without creating PRs
        type: boolean
        default: false
      discovery_shard:
        description: Optional subsystem scan for a targeted validation run
        type: string
        default: ''
      max_prs:
        description: Maximum independent concerns to write (1-100)
        type: number
        default: 100
      maintenance_pr:
        description: Repair an existing docs PR instead of discovering new ones
        type: string
        default: ''
      maintenance_apply:
        description: Publish the maintenance repair (false is a dry run)
        type: boolean
        default: false
      maintenance_force:
        description: Resume a maintenance PR after three unsuccessful rounds
        type: boolean
        default: false
      maintenance_feedback:
        description: Additional source-backed feedback for the maintenance PR
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

# Serialize the entire run, including publication. A retry must not race another
# planner over the same gaps. Every run rechecks live PRs before publishing.
concurrency:
  group: nightly-docs
  cancel-in-progress: false

jobs:
  maintain:
    if: github.event_name == 'workflow_dispatch' && inputs.maintenance_pr != ''
    permissions:
      contents: write
      pull-requests: write
      checks: write
    uses: ./.github/workflows/docs-pr-maintenance.yml
    with:
      pr_number: ${{ inputs.maintenance_pr }}
      apply: ${{ inputs.maintenance_apply }}
      force: ${{ inputs.maintenance_force }}
      feedback: ${{ inputs.maintenance_feedback }}
    secrets: inherit

  prepare:
    if: github.repository == 'ome-projects/ome' && inputs.maintenance_pr == '' && (github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ome-runner-cpu
    timeout-minutes: 45
    outputs:
      scans: ${{ steps.partition.outputs.matrix }}
      base_sha: ${{ steps.baseline.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MAX_PR_COUNT: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.max_prs) || '100' }}
      DISCOVERY_SHARD: ${{ inputs.discovery_shard }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin the default-branch documentation baseline
        id: baseline
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/nightly-docs-setup
        with:
          source-sha: ${{ steps.baseline.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Verify the base documentation site builds before planning
        run: |
          python3 "$RUNNER_TEMP/nightly-docs-tools/build_site.py" website "$RUNNER_TEMP/nightly-docs-base-site"
      - name: Gather code history and existing documentation PRs
        env:
          NIGHTLY_CONTEXT: ${{ runner.temp }}/nightly-docs-context/context.json
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-docs-context"
          python3 "$RUNNER_TEMP/nightly-docs-tools/nightly_docs.py" context
      - name: Partition discovery by subsystem
        id: partition
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/discovery.py" partition
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-docs-context
          path: ${{ runner.temp }}/nightly-docs-context
          if-no-files-found: error
          retention-days: 2

  discover:
    needs: prepare
    runs-on: ome-runner-cpu
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.scans) }}
    name: 'Discover: ${{ matrix.shard }}'
    env:
      GH_TOKEN: ${{ github.token }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nightly-docs-setup
        with:
          source-sha: ${{ needs.prepare.outputs.base_sha }}
      - uses: actions/download-artifact@v5
        with:
          name: nightly-docs-context
          path: ${{ runner.temp }}/nightly-docs-context
      - name: Prepare this subsystem's discovery context
        env:
          NIGHTLY_CONTEXT: ${{ runner.temp }}/nightly-docs-scan-context.json
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/discovery.py" context
      - name: Identify separate documentation concerns
        id: discover
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: Read and follow ${{ runner.temp }}/nightly-docs-tools/plan.md. The context file is ${{ runner.temp }}/nightly-docs-scan-context.json.
          claude_args: >-
            --model claude-fable-5
            --effort xhigh
            --max-turns 200
            --tools "Read,Glob,Grep"
            --allowedTools "Read,Glob,Grep"
            --json-schema '{"type":"object","additionalProperties":false,"properties":{"concerns":{"type":"array","maxItems":100,"items":{"type":"object","additionalProperties":false,"properties":{"area":{"type":"string"},"concern":{"type":"string"},"source_commit":{"type":"integer","minimum":1},"title":{"type":"string"},"question":{"type":"string"},"evidence":{"type":"string"},"doc_paths":{"type":"array","minItems":1,"items":{"type":"string"}},"placement":{"type":"object","additionalProperties":false,"properties":{"examined_pages":{"type":"array","minItems":1,"items":{"type":"string"}},"canonical_pages":{"type":"array","items":{"type":"string"}},"new_page_reason":{"type":"string"}},"required":["examined_pages","canonical_pages","new_page_reason"]}},"required":["area","concern","source_commit","title","question","evidence","doc_paths","placement"]}},"inspected_commits":{"type":"array","items":{"type":"integer","minimum":1}},"remaining_work":{"type":"string"}},"required":["concerns","inspected_commits","remaining_work"]}'
      - name: Validate and record scan coverage
        env:
          PLAN_JSON: ${{ steps.discover.outputs.structured_output }}
          SCAN_OUTPUT: ${{ runner.temp }}/nightly-docs-scan-${{ matrix.shard }}.json
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/discovery.py" scan
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-docs-scan-${{ matrix.shard }}
          path: ${{ runner.temp }}/nightly-docs-scan-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 2

  plan:
    needs: [prepare, discover]
    # Failed scans remain failed, but cannot suppress validated sibling artifacts.
    if: always() && !cancelled() && needs.prepare.result == 'success'
    runs-on: ome-runner-cpu
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      complete: ${{ steps.plan.outputs.complete }}
      missing: ${{ steps.plan.outputs.missing }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nightly-docs-setup
        with:
          source-sha: ${{ needs.prepare.outputs.base_sha }}
      - uses: actions/download-artifact@v5
        with:
          name: nightly-docs-context
          path: ${{ runner.temp }}/nightly-docs-context
      - uses: actions/download-artifact@v5
        with:
          pattern: nightly-docs-scan-*
          path: ${{ runner.temp }}/nightly-docs-scans
          merge-multiple: true
      - name: Combine scans and defer duplicate or conflicting concerns
        id: plan
        env:
          SCAN_DIR: ${{ runner.temp }}/nightly-docs-scans
          REPORT_OUTPUT: ${{ runner.temp }}/nightly-docs-discovery-report.json
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/discovery.py" combine
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-docs-discovery-report
          path: ${{ runner.temp }}/nightly-docs-discovery-report.json
          if-no-files-found: error
          retention-days: 14

  write:
    needs: plan
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ome-runner-cpu
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: 'Document: ${{ matrix.concern }}'
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ needs.plan.outputs.base_sha }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      ITEM_JSON: ${{ toJSON(matrix) }}
    steps:
      # Load automation from the immutable workflow revision, then the setup
      # action switches to the same clean default-branch snapshot for all jobs.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nightly-docs-setup
        with:
          source-sha: ${{ needs.plan.outputs.base_sha }}
      - name: Save the single concern
        env:
          NIGHTLY_ITEM: ${{ runner.temp }}/nightly-docs-item.json
        run: |
          python3 "$RUNNER_TEMP/nightly-docs-tools/nightly_docs.py" evidence
      - name: Update documentation for this concern only
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: Read and follow ${{ runner.temp }}/nightly-docs-tools/write.md. NIGHTLY_ITEM is ${{ runner.temp }}/nightly-docs-item.json; the source commit diff is ${{ runner.temp }}/nightly-docs-source.patch.
          claude_args: >-
            --model claude-fable-5
            --effort xhigh
            --max-turns 120
            --tools "Read,Glob,Grep,Edit,Write"
            --allowedTools "Read,Glob,Grep,Edit,Write"
      - name: Export untrusted documentation data
        env:
          BUNDLE_PATH: ${{ runner.temp }}/nightly-docs-bundle.json
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/nightly_docs.py" export
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-docs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/nightly-docs-bundle.json
          if-no-files-found: error
          overwrite: true
          retention-days: 2

  publish:
    needs: [plan, write]
    # Successful writers can publish even when another matrix item fails.
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ome-runner-cpu
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: 'Validate and publish: ${{ matrix.concern }}'
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ needs.plan.outputs.base_sha }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      ITEM_JSON: ${{ toJSON(matrix) }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      # Only data crosses the job boundary. No writer scripts, Git metadata,
      # hooks, config, or review verdicts are reused in this privileged job.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nightly-docs-setup
        with:
          source-sha: ${{ needs.plan.outputs.base_sha }}
      - name: Set validation evidence paths
        run: |
          echo "OVERLAP_PATH=$RUNNER_TEMP/nightly-docs-validation/overlaps.json" >> "$GITHUB_ENV"
          echo "VALIDATION_DIR=$RUNNER_TEMP/nightly-docs-validation" >> "$GITHUB_ENV"
      - name: Find this concern's artifact
        id: artifact
        env:
          ARTIFACT_NAME: nightly-docs-${{ strategy.job-index }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --paginate \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false) | .id")
          if [ -n "$ids" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Writer produced no artifact for this concern; no PR created." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v5
        if: steps.artifact.outputs.found == 'true'
        with:
          name: nightly-docs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/nightly-docs-incoming
      - name: Validate and import documentation data with pristine guards
        if: steps.artifact.outputs.found == 'true'
        id: scope
        env:
          BUNDLE_PATH: ${{ runner.temp }}/nightly-docs-incoming/nightly-docs-bundle.json
          NIGHTLY_ITEM: ${{ runner.temp }}/nightly-docs-item.json
        run: |
          python3 "$RUNNER_TEMP/nightly-docs-tools/nightly_docs.py" evidence
          python3 "$RUNNER_TEMP/nightly-docs-tools/nightly_docs.py" import
          git -c core.hooksPath=/dev/null diff --cached --no-ext-diff --no-textconv > "$RUNNER_TEMP/nightly-docs-review.patch"
          mkdir -p "$VALIDATION_DIR"
          cp "$NIGHTLY_ITEM" "$VALIDATION_DIR/item.json"
          cp "$RUNNER_TEMP/nightly-docs-review.patch" "$VALIDATION_DIR/documentation.patch"
      - name: Capture actual overlapping human PR documentation changes
        if: steps.scope.outputs.changed == 'true'
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/nightly_docs.py" overlaps
      - name: Independently review accuracy and scope
        if: steps.scope.outputs.changed == 'true'
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: Read and follow ${{ runner.temp }}/nightly-docs-tools/review.md. NIGHTLY_ITEM is ${{ runner.temp }}/nightly-docs-item.json. Read ${{ runner.temp }}/nightly-docs-review.patch, ${{ runner.temp }}/nightly-docs-source.patch, and ${{ env.OVERLAP_PATH }}.
          claude_args: >-
            --model claude-fable-5
            --effort xhigh
            --max-turns 120
            --tools "Read,Glob,Grep"
            --allowedTools "Read,Glob,Grep"
            --json-schema '{"type":"object","additionalProperties":false,"properties":{"single_concern":{"type":"boolean"},"accurate":{"type":"boolean"},"reason":{"type":"string"},"placement_appropriate":{"type":"boolean"},"related_docs_consistent":{"type":"boolean"},"no_competing_pr":{"type":"boolean"}},"required":["single_concern","accurate","reason","placement_appropriate","related_docs_consistent","no_competing_pr"]}'
      - name: Record the review decision
        if: steps.scope.outputs.changed == 'true'
        id: verdict
        env:
          REVIEW_JSON: ${{ steps.review.outputs.structured_output }}
        run: |
          python3 "$RUNNER_TEMP/nightly-docs-tools/nightly_docs.py" review
      - uses: pnpm/action-setup@v4
        if: steps.verdict.outputs.accepted == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v6
        if: steps.verdict.outputs.accepted == 'true'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Build the documentation site
        if: steps.verdict.outputs.accepted == 'true'
        run: |
          python3 "$RUNNER_TEMP/nightly-docs-tools/build_site.py" website "$RUNNER_TEMP/nightly-docs-site"
      - name: Publish one documentation PR or validate a dry run
        if: steps.verdict.outputs.accepted == 'true'
        env:
          REVIEW_JSON: ${{ steps.review.outputs.structured_output }}
        run: |
          gh auth setup-git
          python3 "$RUNNER_TEMP/nightly-docs-tools/nightly_docs.py" publish
      - name: No-op summary
        if: steps.scope.outputs.changed == 'false'
        run: echo "No supported documentation change remained for this concern; no PR created." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.changed == 'true'
        with:
          name: nightly-docs-validation-${{ strategy.job-index }}
          path: ${{ env.VALIDATION_DIR }}
          retention-days: 14
          if-no-files-found: error

  discovery-coverage:
    needs: plan
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ome-runner-cpu
    timeout-minutes: 5
    env:
      COMPLETE: ${{ needs.plan.outputs.complete }}
      MISSING_SHARDS: ${{ needs.plan.outputs.missing }}
    steps:
      - name: Report incomplete discovery without blocking successful concerns
        run: |
          if [ "$COMPLETE" != 'true' ]; then
            echo "::error::Missing validated discovery scans: $MISSING_SHARDS"
            echo "Successful scans continue through normal review and publication guards."
            exit 1
          fi
          echo "All requested discovery scans supplied validated results."
