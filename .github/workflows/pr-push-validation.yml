name: PR Push Validation

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read
  security-events: write  # Required for uploading SARIF files

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Run fmt check
        run: |
          make fmt
          git diff --exit-code || (echo "Please run 'make fmt' to format code" && exit 1)

      - name: Run vet
        run: make vet

      - name: Run tidy
        run: make tidy

      # - name: Run golangci-lint
      #   run: make ci-lint
      # TODO: Re-enable linting once fixed

      - name: Run Helm lint
        run: make helm-lint

  test:
    name: Test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The in-process rollout models are CPU-bound and scale with cores; on a
    # four-core runner the whole suite needs several hours, so the heaviest
    # packages run in shards of their own (make test-packages).
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: workload
            packages: ./pkg/controller/v1beta1/workload/...
          - shard: coordination
            packages: ./pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/coordination/...
          - shard: canary-scaling
            packages: >-
              ./pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/...
              ./pkg/controller/v1beta1/inferenceservice/reconcilers/scaling/...
              ./pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/...
          - shard: rest
            packages: ''
    env:
      # The packages the other shards run, dropped from the rest shard.
      HEAVY_PACKAGES: pkg/controller/v1beta1/workload|reconcilers/omenative/coordination|reconcilers/omenative/canary|reconcilers/scaling|reconcilers/omenative/rolloutrun
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pkg/xet/target
          key: ${{ runner.os }}-rust-${{ hashFiles('pkg/xet/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Build the xet library
        # The shard vets and builds before it tests; a restored pkg/xet/target
        # may hold an archive with LLVM bitcode, which go vet refuses to link,
        # so build (and strip) it first.
        run: make xet-build

      - name: Vet
        if: matrix.shard == 'rest'
        run: make fmt vet

      - name: Run tests
        run: |
          if [ "${{ matrix.shard }}" = rest ]; then
            make test-packages TEST_SHARD=rest TEST_EXCLUDE="$HEAVY_PACKAGES"
          else
            make test-packages TEST_SHARD="${{ matrix.shard }}" TEST_PACKAGES="${{ matrix.packages }}"
          fi

      - name: Upload the shard's coverage profile
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.out
          retention-days: 7

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Download the shard profiles
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: profiles
          merge-multiple: true

      - name: Assemble one profile per package group
        # The shards test disjoint packages, so their blocks never overlap and
        # make coverage reads the three group profiles it always has.
        run: |
          module="$(go list -m)"
          for group in cmd pkg internal; do
            { echo "mode: atomic"; grep -h -v '^mode:' profiles/*.out | grep "^${module}/${group}/" || true; } > "coverage-${group}.out"
          done

      - name: Check coverage threshold
        run: |
          echo "::group::Coverage Report"
          make coverage
          echo "::endgroup::"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage-cmd.out
            coverage-pkg.out
            coverage-internal.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage-cmd.out,coverage-pkg.out,coverage-internal.out
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [ome-manager, model-agent, ome-agent]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Rust
        if: matrix.component == 'ome-agent'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        if: matrix.component == 'ome-agent'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pkg/xet/target
          key: ${{ runner.os }}-rust-${{ hashFiles('pkg/xet/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Build ${{ matrix.component }}
        run: make ${{ matrix.component }}

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.component }}-binary
          path: bin/${{ matrix.component }}

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ome-image, model-agent-image, ome-agent-image]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Rust
        if: matrix.image == 'ome-agent-image'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        if: matrix.image == 'ome-agent-image'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pkg/xet/target
          key: ${{ runner.os }}-rust-${{ hashFiles('pkg/xet/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Strip the cached xet library
        if: matrix.image == 'ome-agent-image'
        # A restored pkg/xet/target may hold an archive built before the
        # Makefile stripped its LLVM bitcode; go vet refuses to link one.
        run: make xet-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }}
        run: |
          make ${{ matrix.image }}
        env:
          TAG: pr-${{ github.event.pull_request.number }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Check licenses
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./... --disallowed_types=forbidden,restricted

  all-checks-passed:
    name: All CI Checks Passed
    needs: [lint, test, coverage, build, docker-build, security-scan, license-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all job statuses
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI checks failed"
            exit 1
          else
            echo "All CI checks passed successfully"
          fi
