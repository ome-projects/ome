name: PR Validation

on:
  pull_request:
    branches: [ main, release-* ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write  # Required for uploading SARIF files if we add security scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit-checks:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: |
          make controller-gen
          make envtest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        id: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Post failure comment on PR
        if: failure() && steps.pre-commit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `⚠️ **Pre-commit checks failed**\n\nPlease run the following locally and commit the fixes:\n\`\`\`bash\npre-commit run --all-files\ngit add -u && git commit\n\`\`\`\nSee [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#pre-commit-check) for setup instructions.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  test-and-build:
    name: Test and Build (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The in-process rollout models are CPU-bound and scale with cores; on a
    # four-core runner the whole suite needs several hours, so the heaviest
    # packages run in shards of their own (make test-packages).
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: workload
            packages: ./pkg/controller/v1beta1/workload/...
          - shard: coordination
            packages: ./pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/coordination/...
          - shard: canary-scaling
            packages: >-
              ./pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/canary/...
              ./pkg/controller/v1beta1/inferenceservice/reconcilers/scaling/...
              ./pkg/controller/v1beta1/inferenceservice/reconcilers/omenative/rolloutrun/...
          - shard: rest
            packages: ''
    env:
      # The packages the other shards run, dropped from the rest shard.
      HEAVY_PACKAGES: pkg/controller/v1beta1/workload|reconcilers/omenative/coordination|reconcilers/omenative/canary|reconcilers/scaling|reconcilers/omenative/rolloutrun
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache test dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            bin/
            ~/.cargo/registry
            ~/.cargo/git
            pkg/xet/target
          key: ${{ runner.os }}-test-${{ hashFiles('**/go.sum', 'pkg/xet/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-
            ${{ runner.os }}-go-
            ${{ runner.os }}-rust-

      - name: Build the xet library
        # The shard vets and builds before it tests; a restored pkg/xet/target
        # may hold an archive with LLVM bitcode, which go vet refuses to link,
        # so build (and strip) it first.
        run: make xet-build

      - name: Vet
        if: matrix.shard == 'rest'
        run: make fmt vet

      - name: Run tests
        run: |
          if [ "${{ matrix.shard }}" = rest ]; then
            make test-packages TEST_SHARD=rest TEST_EXCLUDE="$HEAVY_PACKAGES"
          else
            make test-packages TEST_SHARD="${{ matrix.shard }}" TEST_PACKAGES="${{ matrix.packages }}"
          fi

      - name: Upload the shard's coverage profile
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.out
          retention-days: 7

      - name: Build binaries
        if: matrix.shard == 'rest'
        run: |
          make ome-manager
          make model-agent

  coverage:
    name: Coverage
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Download the shard profiles
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: profiles
          merge-multiple: true

      - name: Assemble one profile per package group
        # The shards test disjoint packages, so their blocks never overlap and
        # make coverage reads the three group profiles it always has.
        run: |
          module="$(go list -m)"
          for group in cmd pkg internal; do
            { echo "mode: atomic"; grep -h -v '^mode:' profiles/*.out | grep "^${module}/${group}/" || true; } > "coverage-${group}.out"
          done

      - name: Check coverage threshold
        run: |
          echo "::group::Coverage Report"
          make coverage
          echo "::endgroup::"

      - name: Upload test coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            coverage-cmd.out
            coverage-pkg.out
            coverage-internal.out
          retention-days: 7

  cli-cross-compile:
    name: CLI cross-compile (CGO_ENABLED=0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Cross-compile kubectl-ome
        run: make kubectl-ome-cross

  # Docker builds only validate Dockerfile/build-context breakage —
  # test-and-build already compiles and tests the same code natively —
  # so they run only when a docker-relevant path actually changed.
  docker-changes:
    name: Detect Docker-Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | \
             grep -qE '^(dockerfiles/|Makefile|pkg/xet/|scheduler/|go\.(mod|sum)|\.github/workflows/(dev-images\.yaml|pr-validation\.yml))'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [pre-commit-checks, docker-changes]
    if: needs.docker-changes.outputs.docker == 'true'
    strategy:
      matrix:
        image: [ome-image, model-agent-image, ome-agent-image, ome-scheduler-image, alfred-image]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Rust
        if: matrix.image == 'ome-agent-image'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        if: matrix.image == 'ome-agent-image'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pkg/xet/target
          key: ${{ runner.os }}-rust-${{ hashFiles('pkg/xet/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Strip the cached xet library
        if: matrix.image == 'ome-agent-image'
        # A restored pkg/xet/target may hold an archive built before the
        # Makefile stripped its LLVM bitcode; go vet refuses to link one.
        run: make xet-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (amd64 only)
        run: |
          # Build only for amd64 to save time in PR validation
          # Multi-arch builds are done during release
          make ${{ matrix.image }}
        env:
          TAG: pr-${{ github.event.pull_request.number }}-${{ github.run_number }}
          REGISTRY: local
          ARCH: linux/amd64

  # Optional multi-arch validation - only runs when 'test-multiarch' label is present
  docker-multiarch-validation:
    name: Docker Multi-Arch Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: pre-commit-checks
    if: contains(github.event.pull_request.labels.*.name, 'test-multiarch')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pkg/xet/target
          key: ${{ runner.os }}-rust-${{ hashFiles('pkg/xet/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch images (no push)
        run: |
          echo "🌍 Building multi-arch images for validation..."
          # Build but don't push - just validate the build works
          docker buildx build --platform=linux/amd64,linux/arm64 \
            --build-arg VERSION=pr-test \
            --build-arg GIT_TAG=pr-${{ github.event.pull_request.number }} \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            . -f dockerfiles/manager.Dockerfile \
            -t local/ome-manager:pr-test

          docker buildx build --platform=linux/amd64,linux/arm64 \
            --build-arg VERSION=pr-test \
            --build-arg GIT_TAG=pr-${{ github.event.pull_request.number }} \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            . -f dockerfiles/model-agent.Dockerfile \
            -t local/model-agent:pr-test
          echo "✅ Multi-arch build validation successful"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Run golangci-lint
        run: make ci-lint

  generate-drift:
    name: Generated Code Drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Regenerate manifests and code
        run: make manifests generate

      - name: Verify no drift
        run: |
          git diff --exit-code || {
            echo "::error::make manifests generate produced changes — regenerate and commit them"
            exit 1
          }

      - name: Vendor optional CRDs
        run: make dep-crds

  summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs: [pre-commit-checks, test-and-build, coverage, cli-cross-compile, docker-validation, lint, generate-drift]
    if: always()
    steps:
      - name: PR Status Summary
        uses: actions/github-script@v8
        with:
          script: |
            const needs = context.payload.workflow_run ?
              context.payload.workflow_run.pull_requests[0].number :
              context.issue.number;

            const jobs = {
              'pre-commit-checks': '${{ needs.pre-commit-checks.result }}',
              'test-and-build': '${{ needs.test-and-build.result }}',
              'coverage': '${{ needs.coverage.result }}',
              'cli-cross-compile': '${{ needs.cli-cross-compile.result }}',
              'docker-validation': '${{ needs.docker-validation.result }}',
              'lint': '${{ needs.lint.result }}',
              'generate-drift': '${{ needs.generate-drift.result }}'
            };

            let allPassed = true;
            let summary = '## 📋 PR Validation Summary\n\n';

            for (const [job, status] of Object.entries(jobs)) {
              const emoji = status === 'success' ? '✅' : status === 'skipped' ? '⏭️' : '❌';
              summary += `${emoji} **${job}**: ${status}\n`;
              if (status !== 'success' && status !== 'skipped') {
                allPassed = false;
              }
            }

            summary += '\n';
            summary += allPassed ?
              '### ✅ All checks passed! Ready for review.' :
              '### ❌ Some checks failed. Please review the errors above.';

            core.summary.addRaw(summary).write();
