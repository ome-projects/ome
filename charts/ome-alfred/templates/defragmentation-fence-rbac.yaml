{{- if and .Values.enabled .Values.defragmentationFence.enabled }}
# Cordon and uncordon the TPU partitions the TPU defragmentation policy drains.
# patch allows any node field; only Alfred's code limits it to the cordon and
# its own annotation, and to nodes carrying that annotation. Kept out of the
# base ClusterRole so installs without the opt-in stay read-only on nodes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ome-alfred-defragmentation-fence
  labels:
    {{- include "ome-alfred.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "" ]
    resources: [ "nodes" ]
    verbs: [ "get", "patch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ome-alfred-defragmentation-fence
  labels:
    {{- include "ome-alfred.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ome-alfred-defragmentation-fence
subjects:
  - kind: ServiceAccount
    name: ome-alfred
    namespace: {{ .Release.Namespace }}
{{- end }}
