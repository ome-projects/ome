{{- if .Values.enabled }}
# Metrics endpoint: every replica observes, so scraping any pod works.
apiVersion: v1
kind: Service
metadata:
  name: ome-alfred-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ome-alfred.labels" . | nindent 4 }}
spec:
  selector:
    control-plane: ome-alfred
  ports:
  - name: metrics
    port: {{ .Values.metrics.port }}
    targetPort: metrics
    protocol: TCP
{{- end }}
