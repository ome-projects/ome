                                  stabilizationWindowSeconds:
                                    format: int32
                                    type: integer
                                  tolerance:
                                    anyOf:
                                    - type: integer
                                    - type: string
                                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                    x-kubernetes-int-or-string: true
                                type: object
                            type: object
                          name:
                            type: string
                        type: object
                      restoreToOriginalReplicaCount:
                        type: boolean
                      scalingModifiers:
                        properties:
                          activationTarget:
