{{- if .Values.ome.rolloutPolicy.enabled }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: rolloutpolicies.ome.io
spec:
  group: ome.io
  names:
    kind: RolloutPolicy
    listKind: RolloutPolicyList
    plural: rolloutpolicies
    singular: rolloutpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.portableDigest
      name: Digest
      type: string
    - jsonPath: .status.attachedGroups
      name: Refs
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              blueGreen:
                type: object
              canary:
                properties:
                  prometheus:
                    properties:
                      authRef:
                        properties:
                          key:
                            type: string
                          name:
                            default: ""
                            type: string
                          optional:
                            type: boolean
                        required:
                        - key
                        type: object
                        x-kubernetes-map-type: atomic
                      headers:
                        additionalProperties:
                          type: string
                        type: object
                      providerRef:
                        properties:
                          name:
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      serverAddress:
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: at most one of providerRef and serverAddress may be
                        set
                      rule: '!(has(self.providerRef) && has(self.serverAddress))'
                  readyTimeout:
                    type: string
                  scaleDownDelaySeconds:
                    format: int32
                    type: integer
                  steps:
                    items:
                      properties:
                        analysis:
                          properties:
                            failureLimit:
                              format: int32
                              minimum: 1
                              type: integer
                            initialDelay:
                              type: string
                            interval:
                              type: string
                            metrics:
                              items:
                                properties:
                                  name:
                                    type: string
                                  operator:
                                    enum:
                                    - LT
                                    - LTE
                                    - GT
                                    - GTE
                                    type: string
                                  query:
                                    type: string
                                  threshold:
                                    type: string
                                required:
                                - name
                                - operator
                                - query
                                - threshold
                                type: object
                              maxItems: 10
                              minItems: 1
                              type: array
                              x-kubernetes-list-map-keys:
                              - name
                              x-kubernetes-list-type: map
                            onInconclusive:
                              enum:
                              - Hold
                              - Rollback
                              - RollbackOnStall
                              type: string
                          required:
                          - failureLimit
                          - interval
                          - metrics
                          type: object
                        capacity:
                          anyOf:
                          - type: integer
                          - type: string
                          x-kubernetes-int-or-string: true
                        pause:
                          properties:
                            duration:
                              type: string
                          type: object
                        traffic:
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                      required:
                      - capacity
                      - traffic
                      type: object
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              rollingUpdate:
                properties:
                  maxSurge:
                    anyOf:
                    - type: integer
                    - type: string
                    x-kubernetes-int-or-string: true
                  maxUnavailable:
                    anyOf:
                    - type: integer
                    - type: string
                    x-kubernetes-int-or-string: true
                type: object
            type: object
            x-kubernetes-validations:
            - message: exactly one of canary, blueGreen, or rollingUpdate must be
                set
              rule: (has(self.canary)?1:0) + (has(self.blueGreen)?1:0) + (has(self.rollingUpdate)?1:0)
                == 1
          status:
            properties:
              attachedGroups:
                format: int32
                type: integer
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              portableDigest:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
