apiVersion: v2
name: ome-quota-manager
description: >-
  OME fleet quota control plane. Assembles the AcceleratorQuota tree, reports
  each node's position and condition, and renders the tree into Kueue on a
  workload cluster or projects per-cluster shares onto members from a
  management cluster. Installed as its own Deployment
  so the Kueue write grant it needs is scoped to a ServiceAccount that does not
  also run the InferenceService reconcilers or the pod mutating webhook.
  Requires the ome-crd chart (ome.io/AcceleratorQuota).
type: application
version: 0.1.0
appVersion: "0.1.0"
