---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ome-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ome.labels" . | nindent 4 }}
    control-plane: ome-controller-manager
    controller-tools.k8s.io: "1.0"
  annotations:
    prometheus.io/scrape: 'true'
spec:
  replicas: {{ .Values.ome.controller.replicaCount }}
  selector:
    matchLabels:
      control-plane: ome-controller-manager
      controller-tools.k8s.io: "1.0"
  template:
    metadata:
      labels:
        control-plane: ome-controller-manager
        controller-tools.k8s.io: "1.0"
        logging-forward: enabled
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/ome-controller/configmap.yaml") . | sha256sum }}
        kubectl.kubernetes.io/default-container: manager
        prometheus.io/scrape: 'true'
        prometheus.io/path: '/metrics'
        prometheus.io/port: '8080'
        {{- with .Values.ome.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: ome-controller-manager
      {{- with .Values.ome.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ome.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ome.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ome.controller.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $imagePullSecrets := .Values.ome.controller.imagePullSecrets | default .Values.global.imagePullSecrets }}
      {{- if $imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
      - command:
        - /manager
        image: {{ include "ome.imageWithHub" (dict "values" .Values "repository" .Values.ome.controller.image "tag" .Values.ome.controller.tag) }}
        imagePullPolicy: IfNotPresent
        name: manager
        args:
        - "--metrics-bind-address=:8080"
        - "--leader-elect"
        - "--webhook"
        - "--zap-encoder=console"
        {{- if .Values.ome.controller.inferenceServiceMaxConcurrentReconciles }}
        - "--inferenceservice-max-concurrent-reconciles={{ .Values.ome.controller.inferenceServiceMaxConcurrentReconciles }}"
        {{- end }}
        {{- if .Values.ome.controller.inferenceReplicaMaxConcurrentReconciles }}
        - "--inferencereplica-max-concurrent-reconciles={{ .Values.ome.controller.inferenceReplicaMaxConcurrentReconciles }}"
        {{- end }}
        {{- if .Values.ome.controller.configCacheTTL }}
        - "--config-cache-ttl={{ .Values.ome.controller.configCacheTTL }}"
        {{- end }}
        {{- if .Values.ome.controller.kubeAPIQPS }}
        - "--kube-api-qps={{ .Values.ome.controller.kubeAPIQPS }}"
        {{- end }}
        {{- if .Values.ome.controller.kubeAPIBurst }}
        - "--kube-api-burst={{ .Values.ome.controller.kubeAPIBurst }}"
        {{- end }}
        {{- if .Values.ome.multicluster.enabled }}
        - "--enable-multicluster"
        {{- if .Values.ome.multicluster.role }}
        - "--multicluster-role={{ .Values.ome.multicluster.role }}"
        {{- end }}
        {{- if .Values.ome.multicluster.execCredentials.enabled }}
        - "--allow-exec-credentials"
        - "--exec-credential-allowed-commands={{ .Values.ome.multicluster.execCredentials.allowedCommands }}"
        {{- end }}
        {{- with .Values.ome.multicluster.placementControlPlaneID }}
        - "--placement-control-plane-id={{ . }}"
        {{- end }}
        {{- end }}
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: SECRET_NAME
            value: ome-webhook-server-cert
        livenessProbe:
          failureThreshold: 5
          initialDelaySeconds: 10
          httpGet:
            path: /healthz
            port: 8081
          timeoutSeconds: 5
        readinessProbe:
          initialDelaySeconds: 10
          failureThreshold: 10
          periodSeconds: 5
          httpGet:
            path: /readyz
            port: 8081
          timeoutSeconds: 5
        resources:
{{- if .Values.ome.controller.resources }}
{{ toYaml .Values.ome.controller.resources | trim | indent 12 }}
{{- end }}
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        - containerPort: 8080
          name: metrics
          protocol: TCP
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: ome-webhook-server-cert
