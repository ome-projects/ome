{{- if and .Values.ome.multicluster.enabled (eq .Values.ome.multicluster.role "control-plane") }}
# Binds the generated ome-manager-multicluster-endpoint ClusterRole
# (multicluster_endpoint_role.yaml, regenerated by make manifests) to the
# controller ServiceAccount. Only a multi-cluster control plane runs the
# placement endpoint publisher that writes EndpointSlices and
# BackendTLSPolicies.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ome-manager-multicluster-endpoint
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ome-manager-multicluster-endpoint
subjects:
- kind: ServiceAccount
  name: ome-controller-manager
  namespace: {{ .Release.Namespace }}
{{- end }}
