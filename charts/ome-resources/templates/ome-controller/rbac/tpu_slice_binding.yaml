{{- if .Values.ome.controller.tpuSliceProvisioning }}
# Binds the generated ome-manager-tpu-slice ClusterRole (tpu_slice_role.yaml,
# regenerated by make manifests) to the controller ServiceAccount. Only a
# manager configured with tpuSliceProvisioning provisions accelerator.gke.io
# Slices; the InferenceReplica reconciler reads and watches them solely under
# that configuration.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ome-manager-tpu-slice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ome-manager-tpu-slice
subjects:
- kind: ServiceAccount
  name: ome-controller-manager
  namespace: {{ .Release.Namespace }}
{{- end }}
