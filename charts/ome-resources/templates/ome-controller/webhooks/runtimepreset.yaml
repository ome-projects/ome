---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  creationTimestamp: null
  name: servingruntime-preset.ome.io
  annotations:
    cert-manager.io/inject-ca-from: ome/serving-cert
webhooks:
  # Both mutators only change runtimes that set ome.io/engine and pass every
  # other runtime through, so has-engine-preset skips the call for those,
  # including this chart's default-runtime. Otherwise, while the service still
  # routes to a manager that does not serve these paths (an upgrade from
  # v1.2.x), Fail rejects every ServingRuntime and ClusterServingRuntime write.
  - clientConfig:
      caBundle: Cg==
      service:
        name: ome-webhook-server-service
        namespace: {{ .Release.Namespace }}
        path: /mutate-ome-io-v1beta1-servingruntime-preset
    failurePolicy: Fail
    name: servingruntime.ome-webhook-server.preset
    sideEffects: None
    admissionReviewVersions: ["v1"]
    matchConditions:
      - name: skip-deletion
        expression: "!has(object.metadata.deletionTimestamp)"
      - name: has-engine-preset
        expression: "has(object.metadata.annotations) && 'ome.io/engine' in object.metadata.annotations && object.metadata.annotations['ome.io/engine'] != ''"
    rules:
      - apiGroups:
          - ome.io
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - servingruntimes
  - clientConfig:
      caBundle: Cg==
      service:
        name: ome-webhook-server-service
        namespace: {{ .Release.Namespace }}
        path: /mutate-ome-io-v1beta1-clusterservingruntime-preset
    failurePolicy: Fail
    name: clusterservingruntime.ome-webhook-server.preset
    sideEffects: None
    admissionReviewVersions: ["v1"]
    matchConditions:
      - name: skip-deletion
        expression: "!has(object.metadata.deletionTimestamp)"
      - name: has-engine-preset
        expression: "has(object.metadata.annotations) && 'ome.io/engine' in object.metadata.annotations && object.metadata.annotations['ome.io/engine'] != ''"
    rules:
      - apiGroups:
          - ome.io
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - clusterservingruntimes
