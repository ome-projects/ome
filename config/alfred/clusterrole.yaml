# Alfred's cluster-state permissions are read-only; only Event reporting writes
# cluster-wide in this phase (OEP-0008 §RBAC). There are no node writes, pod
# writes, pod evictions, or InferenceService patches until the Dispatcher and
# its admission guard land together. Every pod-level action is executed by the
# controller that owns the workload.
# Anything confined to Alfred's own namespace — its ConfigMaps, its
# leader-election Lease — lives in role.yaml instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ome-alfred
  labels:
    app.kubernetes.io/component: "ome-alfred"
rules:
  # Nodes (read-only) — no cordon, no drain, no patch.
  - apiGroups: [ "" ]
    resources: [ "nodes" ]
    verbs: [ "get", "list", "watch" ]

  # Pods (read-only) — candidate selection reads placement; eviction is the
  # owning controller's job.
  - apiGroups: [ "" ]
    resources: [ "pods" ]
    verbs: [ "get", "list", "watch" ]

  # PVCs / PVs (read-only) — PVC-backed model topology in the snapshot.
  - apiGroups: [ "" ]
    resources: [ "persistentvolumeclaims", "persistentvolumes" ]
    verbs: [ "get", "list", "watch" ]

  # Events — recommendations, migrations, evacuation and repair signals, on
  # workloads and nodes in any namespace.
  - apiGroups: [ "" ]
    resources: [ "events" ]
    verbs: [ "create", "patch" ]

  # Direct capability check — one named, uncached Get per observation pass.
  # No list/watch and no write verb can forge the executor heartbeat.
  - apiGroups: [ "coordination.k8s.io" ]
    resources: [ "leases" ]
    resourceNames:
      - ome-inferencereplica-executor
    verbs: [ "get" ]

  # OME CRDs (read).
  - apiGroups: [ "ome.io" ]
    resources:
      - inferenceservices
      - inferenceservices/status
      - inferencereplicas
      - inferencereplicas/status
      - servingruntimes
      - clusterservingruntimes
      - basemodels
      - clusterbasemodels
    verbs: [ "get", "list", "watch" ]
