apiVersion: v1
kind: ConfigMap
metadata:
  name: inferenceservice-config
  namespace: ome
# Kustomize does not restart the manager when this ConfigMap changes. After
# `kubectl apply -k config/default`, restart the manager for settings documented
# below as startup-only:
#   kubectl -n ome rollout restart deployment/ome-controller-manager
#   kubectl -n ome rollout status deployment/ome-controller-manager
data:
  # routeProviderCapabilities declares, per route provider, the per-revision
  # traffic intent it can express (what a canary step's traffic percentage asks
  # of the external route). Keys: GatewayAPI (enableGatewayAPI), KubernetesIngress
  # (ingress creation on without Gateway API), None (ingress creation disabled).
  # Values: capability tokens; today only "weightedRevisionRouting". There is NO
  # in-code default. A provider left out has unknown capabilities (canary traffic
  # percentages are admitted and reported as unverified); a provider listed with
  # [] can express none (admission rejects such a canary, a stored one holds its
  # rollout). Example: {"GatewayAPI": ["weightedRevisionRouting"], "None": []}
  ingress: |-
    {
        "ingressGateway" : "istio-system/ingress-gateway",
        "ingressService" : "istio-ingressgateway.istio-system.svc.cluster.local",
        "omeIngressGateway" : "",
        "ingressDomain"  : "svc.cluster.local",
        "clusterDomain" : "cluster.local",
        "ingressClassName" : "istio",
        "additionalIngressDomains" : null,
        "domainTemplate": "{{ .Name }}.{{ .Namespace }}.{{ .IngressDomain }}",
        "urlScheme": "http",
        "disableIstioVirtualHost": false,
        "pathTemplate": "",
        "disableIngressCreation": true,
        "enableGatewayAPI": false,
        "routeProviderCapabilities": {}
    }

  deploy: |-
    {
      "defaultDeploymentMode": "RawDeployment",
      "replicas": {
        "defaultMinReplicas": 1,
        "defaultMaxReplicas": {
          "engine": 3,
          "decoder": 3,
          "encoder": 3,
          "router": 2
        }
      }
    }

  podDisruptionBudget: |-
    {
      "rawDeployment": {
        "maxUnavailable": 1
      }
    }

  # tpuSliceProvisioning describes TPU node pools that provision slices on
  # demand. Omit this key to provision no slices. Read once at manager startup;
  # when present every field is required (slice.annotations may be {}), the
  # binary has no default for any of them, and an invalid block prevents
  # startup. Two fields are optional. slice.readyTimeout releases and
  # provisions again a slice that has partitions but stays out of a ready state
  # longer than it (e.g. "10m"), while no pod holds it; unset never times a
  # slice out. slice.podAnnotations lists annotation keys copied from a
  # workload's pod template onto the slices created for it, such as a
  # per-workload scheduling priority; a slice keeps the values it was created
  # with. Pools without the provisionOnly label are never provisioned or
  # released. Example for GKE dynamic slicing with single-host Ironwood slices:
  #
  # tpuSliceProvisioning: |-
  #   {
  #     "chipResource": "google.com/tpu",
  #     "nodeLabels": {
  #       "accelerator": "cloud.google.com/gke-tpu-accelerator",
  #       "topology": "cloud.google.com/gke-tpu-topology",
  #       "slice": "cloud.google.com/gke-tpu-slice"
  #     },
  #     "provisionOnly": {
  #       "key": "cloud.google.com/gke-accelerator-topology-mode",
  #       "value": "PROVISION_ONLY"
  #     },
  #     "accelerators": {
  #       "tpu7x": { "sliceType": "tpu7x", "chipsPerHost": 4, "topologies": ["2x2x1"] }
  #     },
  #     "slice": {
  #       "ownerKindLabel": "cloud.google.com/slice-owner-kind",
  #       "ownerNameLabel": "cloud.google.com/slice-owner-name",
  #       "annotations": {
  #         "cloud.google.com/managed-by": "slice-scheduler",
  #         "slice.gke.io/retry-on-failure": "true"
  #       },
  #       "readyStates": ["ACTIVE", "ACTIVE_DEGRADED"],
  #       "podAnnotations": ["example.com/slice-priority"]
  #     }
  #   }

  # The scale-up and scale-down Pod batch sizes bound create and delete work in
  # Pod-equivalent units. Each Instance or gang is selected atomically, and a
  # first eligible Instance larger than its budget proceeds alone. Omitting a
  # batch field preserves that direction's unbounded selection. Scale-down also
  # accepts a percentage string such as "10%" of the current Component footprint,
  # rounded up; the footprint includes live/Terminating Pods and Podless statuses.
  # The scale-down requeue interval polls while destructive work remains in flight; omitting
  # it leaves progress to watched resources and exact configured lifecycle
  # deadlines. The repair batch size bounds the crash-loop repairs opened per
  # Component in one pass, in Instances (a gang counts as one); omitting it
  # leaves the repairs opened per pass unbounded. These settings are read once
  # at manager startup; invalid values prevent startup, and a direct ConfigMap
  # edit requires a manager restart.
  #
  # instanceReadyTimeout is how long a newly created Instance may take to become
  # Ready before its in-flight operation is failed; a per-Component
  # spec.<component>.lifecycle.instanceReadyTimeout always wins. The binary has
  # NO built-in window — omit it and a Component that sets none of its own opens
  # operations with no deadline and reports it as a condition plus an event.
  #
  # prefillDecodeRoll paces a rollout group that lists both the engine (prefill)
  # and the decoder. keepRatio sizes every batch of such a roll so that the share
  # of each side already moving to the new version stays within the group's
  # maintainRatio tolerance of the other side's share (the coordination block's
  # defaultRatioTolerancePercent when the group names none; a tolerance of 100
  # opts a group out), on the drain-first and the surge path alike. The gap it
  # keeps is the tolerance: 12 prefill beside 8 decode at 10 percent move 2:1,
  # 4:2, 6:3, 8:4, 9:5, 11:6, 12:7, 12:8 under a tolerance of 20 (up to 1.33
  # decode Instances off 3:2) and 2:1, 3:2, 5:3, 6:4, 8:5, 9:6, 11:7, 12:8
  # under 5, instead of running 10:5. A batch that cannot fit shrinks, and at
  # least one Instance moves per batch. firstSide names the side that moves first
  # inside every batch, engine or decoder: the other side's moves of the batch
  # are admitted once the named side's new Instances serve. Name the side that
  # takes longer to come back, so one side is down at a time and both return
  # close together; any other value is rejected. The binary has NO built-in
  # rules: omit a field, or the block, and that rule is off.
  lifecycle: |-
    {
      "scaleUpPodBatchSize": 100,
      "scaleDownPodBatchSize": 100,
      "scaleDownRequeueInterval": "5s",
      "repairBatchSize": 10,
      "instanceReadyTimeout": "30m",
      "prefillDecodeRoll": {"keepRatio": true, "firstSide": "decoder"}
    }

  # How many Kubernetes Events the manager may record about one object before
  # client-go's spam filter drops them silently: one bucket per object and
  # event type holding burstSize events, refilled one event every
  # refillInterval. Every emission counts, including repeats. Omitting a field
  # keeps client-go's own default for it (25 events refilled one every five
  # minutes), which a Component of eight gangs spends on creation and
  # readiness alone. Read once at manager startup; non-positive values prevent
  # startup, and a direct ConfigMap edit requires a manager restart.
  eventRecorder: |-
    {
      "burstSize": 400,
      "refillInterval": "5s"
    }

  # How the manager stores InferenceReplica per-Instance status. Read once at
  # manager startup and required: a missing or unknown instanceStatusEncoding
  # prevents startup. ColumnarV2 writes grouped columns when they are strictly
  # smaller than the dense instanceStatuses list and the dense list otherwise;
  # DenseV1 always writes the dense list and is the rollback target.
  # maxDecodedInstances bounds how many rows a stored ColumnarV2 payload may
  # expand to: a positive integer, required for ColumnarV2, sized as the
  # deployment profile's ceiling on transient rows per InferenceReplica and
  # never lowered below the largest stored ColumnarV2 row count.
  omenativeStatus: |-
    {
      "instanceStatusEncoding": "ColumnarV2",
      "maxDecodedInstances": 20000
    }

  # The identity the InferenceService controller writes with: the
  # InferenceReplica admission webhook admits spec writes on the replicas an
  # InferenceService projects only from a listed username or group. The
  # username is the manager's ServiceAccount in the namespace it runs in.
  inferenceReplica: |-
    {
      "controllerIdentity": {
        "usernames": ["system:serviceaccount:ome:ome-controller-manager"]
      }
    }

  canaryAnalysis: |-
    {
      "bundledPrometheusAddress": "http://ome-prometheus.ome.svc:9090",
      "queryTimeout": "5s",
      "maxConcurrency": 8,
      "cacheTTL": "2m"
    }

  # metricsAggregator: the pod webhook's metrics wiring. The two switches are
  # the pod defaults for ome.io/enable-metric-aggregation and
  # ome.io/enable-prometheus-scraping; containerPort and path are where the
  # serving container serves metrics (the pod's prometheus.ome.io annotations
  # override them), aggregatePort is where queue-proxy serves the aggregate,
  # podPrometheusPort is the pod's scrape port when aggregation is off. The
  # manager has no built-in ports: without all four, aggregation and scraping
  # inject nothing and the webhook logs it once.
  metricsAggregator: |-
    {
      "aggregatePort": 9088,
      "containerPort": 8080,
      "enableMetricAggregation": "false",
      "enablePrometheusScraping": "false",
      "path": "/metrics",
      "podPrometheusPort": 9091
    }

  # rdma: the RDMA profile table the pod webhook applies to pods that set
  # ome.io/rdma-auto-inject=true; ome.io/rdma-profile picks a profile, else
  # defaultProfile. Each profile is the env, volumes, mounts, security
  # context and Multus networks of one fabric. The manager has no built-in
  # profile and this profile ships none: every cluster's fabric differs, so
  # the cluster's own values file carries the table. Without one such pods get
  # nothing and the webhook logs it once.
  rdma: |-
    {
      "defaultProfile": "",
      "profiles": {}
    }

  # runtimeProfiles: the port the probe and observability profiles use when
  # a pod names none, and the timings of the three probes a probe profile
  # injects. Without this key probe profiles inject nothing and observability
  # profiles serve only pods that name a port; the webhook logs it once.
  runtimeProfiles: |-
    {
      "defaultPort": 30000,
      "probes": {
        "liveness": {
          "failureThreshold": 5,
          "initialDelaySeconds": 0,
          "periodSeconds": 60,
          "successThreshold": 0,
          "timeoutSeconds": 30
        },
        "readiness": {
          "failureThreshold": 5,
          "initialDelaySeconds": 60,
          "periodSeconds": 30,
          "successThreshold": 1,
          "timeoutSeconds": 30
        },
        "startup": {
          "failureThreshold": 60,
          "initialDelaySeconds": 60,
          "periodSeconds": 30,
          "successThreshold": 0,
          "timeoutSeconds": 30
        }
      }
    }

  # runtimePresets: one ServingRuntime spec per ome.io/engine value. The
  # preset webhook fills it in under the runtime's own fields. Without this
  # key, or for an engine it does not name, a runtime that names an engine is
  # refused with a message that says so.
  runtimePresets: |-
    {
      "sglang-pd": {
        "containers": null,
        "decoderConfig": {
          "runner": {
            "command": [
              "python3",
              "-m",
              "sglang.launch_server",
              "--host",
              "0.0.0.0",
              "--port",
              "30000",
              "--model-path",
              "$(MODEL_PATH)",
              "--disaggregation-mode",
              "decode",
              "--disaggregation-transfer-backend",
              "nixl"
            ],
            "env": [
              {
                "name": "PYTHONUNBUFFERED",
                "value": "1"
              },
              {
                "name": "SGLANG_HOST_IP",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "status.podIP"
                  }
                }
              }
            ],
            "image": "lmsysorg/sglang:latest",
            "livenessProbe": {
              "failureThreshold": 5,
              "httpGet": {
                "path": "/health",
                "port": 30000
              },
              "periodSeconds": 60,
              "timeoutSeconds": 10
            },
            "name": "ome-container",
            "ports": [
              {
                "containerPort": 30000,
                "name": "http",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 5,
              "httpGet": {
                "path": "/health",
                "port": 30000
              },
              "periodSeconds": 30,
              "timeoutSeconds": 10
            },
            "resources": {}
          }
        },
        "engineConfig": {
          "runner": {
            "command": [
              "python3",
              "-m",
              "sglang.launch_server",
              "--host",
              "0.0.0.0",
              "--port",
              "30000",
              "--model-path",
              "$(MODEL_PATH)",
              "--disaggregation-mode",
              "prefill",
              "--disaggregation-transfer-backend",
              "nixl",
              "--disaggregation-bootstrap-port",
              "8998"
            ],
            "env": [
              {
                "name": "PYTHONUNBUFFERED",
                "value": "1"
              },
              {
                "name": "SGLANG_HOST_IP",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "status.podIP"
                  }
                }
              }
            ],
            "image": "lmsysorg/sglang:latest",
            "livenessProbe": {
              "failureThreshold": 5,
              "httpGet": {
                "path": "/health",
                "port": 30000
              },
              "periodSeconds": 60,
              "timeoutSeconds": 10
            },
            "name": "ome-container",
            "ports": [
              {
                "containerPort": 30000,
                "name": "http",
                "protocol": "TCP"
              },
              {
                "containerPort": 8998,
                "name": "bootstrap",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 5,
              "httpGet": {
                "path": "/health",
                "port": 30000
              },
              "periodSeconds": 30,
              "timeoutSeconds": 10
            },
            "resources": {}
          }
        },
        "routerConfig": {
          "runner": {
            "args": [
              "--port",
              "30080",
              "--k8s-namespace",
              "$(NAMESPACE)",
              "--prefill-label-selector",
              "component=engine,ome.io/inferenceservice=$(INFERENCESERVICE_NAME)",
              "--decode-label-selector",
              "component=decoder,ome.io/inferenceservice=$(INFERENCESERVICE_NAME)",
              "--k8s-engine-port",
              "30000",
              "--bootstrap-port",
              "8998"
            ],
            "env": [
              {
                "name": "NAMESPACE",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "metadata.namespace"
                  }
                }
              },
              {
                "name": "INFERENCESERVICE_NAME",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "metadata.labels['ome.io/inferenceservice']"
                  }
                }
              }
            ],
            "image": "lmsysorg/sglang-router:latest",
            "livenessProbe": {
              "failureThreshold": 5,
              "httpGet": {
                "path": "/liveness",
                "port": 30080
              },
              "periodSeconds": 30,
              "timeoutSeconds": 10
            },
            "name": "router",
            "ports": [
              {
                "containerPort": 30080,
                "name": "http",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 5,
              "httpGet": {
                "path": "/readiness",
                "port": 30080
              },
              "periodSeconds": 30,
              "timeoutSeconds": 10
            },
            "resources": {}
          }
        }
      }
    }

  # podMonitor configures every PodMonitor OME generates per InferenceService
  # Component. There is intentionally NO in-code default for any key: supply
  # the values via this ConfigMap (Helm chart / GitOps), so scrape-pipeline
  # values are never hardcoded in the binary.
  #
  # - path, interval, port, fallbackPort: OME's own scrape endpoint, the HTTP
  #                path scraped every interval (Prometheus duration form) on
  #                the container port named `port` when the Component's first
  #                container declares it, wherever it stands; a container
  #                without it is scraped on its first port when that port is
  #                named, else on `fallbackPort`. Annotation-declared extra
  #                endpoints follow at the same interval. Leave one of them
  #                empty and OME adds no endpoint of its own; the manager logs
  #                that once.
  # - labels:      merged into each PodMonitor's metadata.labels (NOT
  #                spec.selector). Opts the monitor into a label-selecting
  #                collector, e.g. an OTel target allocator whose
  #                podMonitorSelector is {monitoring.example.com/scrape-tier: cluster}.
  # - relabelings: appended to every PodMetricsEndpoint so scraped series carry
  #                the same label schema as the legacy pod-annotation scrape.
  #
  podMonitor: |-
    {
      "path": "/metrics",
      "interval": "10s",
      "port": "metrics",
      "fallbackPort": "http"
    }
  # With a label-selecting collector, the same block also carries:
  # podMonitor: |-
  #   {
  #     "path": "/metrics", "interval": "10s", "port": "metrics", "fallbackPort": "http",
  #     "labels": { "monitoring.example.com/scrape-tier": "cluster" },
  #     "relabelings": [
  #       { "sourceLabels": ["__meta_kubernetes_pod_label_ome_io_inferenceservice"], "targetLabel": "inferenceservice" },
  #       { "sourceLabels": ["__meta_kubernetes_pod_label_component"], "targetLabel": "component" },
  #       { "sourceLabels": ["__meta_kubernetes_pod_label_serving_runtime"], "targetLabel": "serving_runtime" },
  #       { "sourceLabels": ["__meta_kubernetes_namespace"], "targetLabel": "k8s_namespace_name" }
  #     ]
  #   }

  modelInit: |-
    {
        "image" : "ghcr.io/moirai-internal/ome-agent:v1.2.2",
        "memoryRequest": "320Gi",
        "memoryLimit": "320Gi",
        "cpuRequest": "15",
        "cpuLimit": "15",
        "compartmentId": "ocid1.compartment.oc1..aaaaaaaarncfmdarfvbvhfj2oknyuvvftcp4p6ra77xlswftk67kcffmm2xq",
        "authType" : "InstancePrincipal",
        "vaultId": "ocid1.vault.oc1.eu-frankfurt-1.ens4gnknaaec4.abtheljrqneswo524ce3ytfqv3wqdjz4yi2drovyjnuo5lghz2fr76a7l7lq",
        "region": "eu-frankfurt-1",
        "extraEnvVars": [
          {
            "name": "INSTANCE_TYPE_MAP",
            "value": "{\"BM.GPU.A10.4\":\"A10\",\"BM.GPU.A100-v2.8\":\"A100-80G\",\"BM.GPU4.8\":\"A100-40G\",\"BM.GPU.B4.8\":\"A100-40G\",\"BM.GPU.H100.8\":\"H100\",\"BM.GPU.H100-NC.8\":\"H100\",\"BM.GPU.H200.8\":\"H200\",\"BM.GPU.H200-NC.8\":\"H200\",\"BM.GPU.B200.8\":\"B200\",\"BM.GPU.B300.8\":\"B300\",\"p5.48xlarge\":\"H100\",\"Standard_ND96isr_H100_v5\":\"H100\",\"a3-highgpu-8g\":\"H100\",\"gd-8xh100ib-i128\":\"H100\",\"gd-8xh200ib-i128\":\"H200\",\"gd-8xl40-i128\":\"L40\",\"gpu-h100-sxm\":\"H100\",\"gpu-h200-sxm\":\"H200\",\"gpu-b200-sxm\":\"B200\",\"gpu-l40s\":\"L40S\"}"
          }
        ]
    }

  omeAgent: |-
    {
      "image": "ghcr.io/moirai-internal/ome-agent:v1.2.2",
      "serviceAccount": "ome-model-metadata",
      "cpuRequest": "100m",
      "memoryRequest": "256Mi",
      "cpuLimit": "500m",
      "memoryLimit": "512Mi",
      "backoffLimit": 2,
      "ttlSecondsAfterFinished": 3600,
      "nodeSelector": {},
      "tolerations": [],
      "affinity": {},
      "priorityClassName": ""
    }
