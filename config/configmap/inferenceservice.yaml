apiVersion: v1
kind: ConfigMap
metadata:
  name: inferenceservice-config
  namespace: ome
# Kustomize does not restart the manager when this ConfigMap changes. After
# `kubectl apply -k config/default`, restart the manager for settings documented
# below as startup-only:
#   kubectl -n ome rollout restart deployment/ome-controller-manager
#   kubectl -n ome rollout status deployment/ome-controller-manager
data:
  ingress: |-
    {
        "ingressGateway" : "knative-serving/knative-ingress-gateway",
        "ingressService" : "istio-ingressgateway.istio-system.svc.cluster.local",
        "omeIngressGateway" : "",
        "ingressDomain"  : "svc.cluster.local",
        "ingressClassName" : "istio",
        "additionalIngressDomains" : null,
        "domainTemplate": "{{ .Name }}.{{ .Namespace }}.{{ .IngressDomain }}",
        "urlScheme": "http",
        "disableIstioVirtualHost": false,
        "pathTemplate": "",
        "disableIngressCreation": true,
        "enableGatewayAPI": false
    }

  deploy: |-
    {
      "defaultDeploymentMode": "RawDeployment"
    }

  # The scale-up and scale-down Pod batch sizes bound create and delete work in
  # Pod-equivalent units. Each Instance or gang is selected atomically, and a
  # first eligible Instance larger than its budget proceeds alone. Omitting a
  # batch field preserves that direction's unbounded selection. The scale-down
  # requeue interval polls while destructive work remains in flight; omitting
  # it leaves progress to watched resources and exact configured lifecycle
  # deadlines. These settings are read once at manager startup; invalid values
  # prevent startup, and a direct ConfigMap edit requires a manager restart.
  #
  # instanceReadyTimeout is how long a newly created Instance may take to become
  # Ready before its in-flight operation is failed; a per-Component
  # spec.<component>.lifecycle.instanceReadyTimeout always wins. The binary has
  # NO built-in window — omit it and a Component that sets none of its own opens
  # operations with no deadline and reports it as a condition plus an event.
  lifecycle: |-
    {
      "scaleUpPodBatchSize": 100,
      "scaleDownPodBatchSize": 100,
      "scaleDownRequeueInterval": "5s",
      "instanceReadyTimeout": "30m"
    }

  # How the manager stores InferenceReplica per-Instance status. Read once at
  # manager startup and required: a missing or unknown instanceStatusEncoding
  # prevents startup. ColumnarV2 writes grouped columns when they are strictly
  # smaller than the dense instanceStatuses list and the dense list otherwise;
  # DenseV1 always writes the dense list and is the rollback target.
  # maxDecodedInstances bounds how many rows a stored ColumnarV2 payload may
  # expand to: a positive integer, required for ColumnarV2, sized as the
  # deployment profile's ceiling on transient rows per InferenceReplica and
  # never lowered below the largest stored ColumnarV2 row count.
  omenativeStatus: |-
    {
      "instanceStatusEncoding": "ColumnarV2",
      "maxDecodedInstances": 20000
    }

  modelInit: |-
    {
        "image" : "ghcr.io/moirai-internal/ome-agent:v1.2.2",
        "memoryRequest": "320Gi",
        "memoryLimit": "320Gi",
        "cpuRequest": "15",
        "cpuLimit": "15",
        "compartmentId": "ocid1.compartment.oc1..aaaaaaaarncfmdarfvbvhfj2oknyuvvftcp4p6ra77xlswftk67kcffmm2xq",
        "authType" : "InstancePrincipal",
        "vaultId": "ocid1.vault.oc1.eu-frankfurt-1.ens4gnknaaec4.abtheljrqneswo524ce3ytfqv3wqdjz4yi2drovyjnuo5lghz2fr76a7l7lq",
        "region": "eu-frankfurt-1",
        "extraEnvVars": [
          {
            "name": "INSTANCE_TYPE_MAP",
            "value": "{\"BM.GPU.A10.4\":\"A10\",\"BM.GPU.A100-v2.8\":\"A100-80G\",\"BM.GPU4.8\":\"A100-40G\",\"BM.GPU.B4.8\":\"A100-40G\",\"BM.GPU.H100.8\":\"H100\",\"BM.GPU.H100-NC.8\":\"H100\",\"BM.GPU.H200.8\":\"H200\",\"BM.GPU.H200-NC.8\":\"H200\",\"BM.GPU.B200.8\":\"B200\",\"BM.GPU.B300.8\":\"B300\",\"p5.48xlarge\":\"H100\",\"Standard_ND96isr_H100_v5\":\"H100\",\"a3-highgpu-8g\":\"H100\",\"gd-8xh100ib-i128\":\"H100\",\"gd-8xh200ib-i128\":\"H200\",\"gd-8xl40-i128\":\"L40\",\"gpu-h100-sxm\":\"H100\",\"gpu-h200-sxm\":\"H200\",\"gpu-b200-sxm\":\"B200\",\"gpu-l40s\":\"L40S\"}"
          }
        ]
    }

  kedaConfig: |-
    {
      "enableKeda" : true,
      "promServerAddress": "http://prometheus-operated.monitoring.svc.cluster.local:9090",
      "customPromQuery": "",
      "scalingThreshold": "10",
      "scalingOperator": "GreaterThanOrEqual"
    }
