---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  creationTimestamp: null
  name: inferencereplica.ome.io
webhooks:
  # A projected InferenceReplica (owned by an InferenceService) accepts spec
  # writes only from the controller identity configured in
  # inferenceservice-config. With no identity configured the webhook accepts
  # writes that carry the ome.io/controller-write=true annotation. A
  # standalone replica is governed by RBAC, plus the standalone rules the
  # webhook enforces (among them: no parentRef or placement fields, no
  # colliding name, no manual migration). See
  # pkg/webhook/admission/inferencereplica/validator.go for the rules.
  - clientConfig:
      caBundle: Cg==
      service:
        name: $(webhookServiceName)
        namespace: $(omeNamespace)
        path: /validate-ome-io-v1beta1-inferencereplica
    failurePolicy: Fail
    name: inferencereplica.ome-webhook-server.validator
    sideEffects: None
    admissionReviewVersions: ["v1"]
    # Skip on objects already being deleted: finalizer-only patches
    # shouldn't trigger spec-invariant checks (would deadlock GC of
    # owned InferenceReplicas during ISVC cascade delete).
    matchConditions:
      - name: skip-deletion
        expression: "!has(object.metadata.deletionTimestamp)"
    rules:
      - apiGroups:
          - ome.io
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - inferencereplicas
