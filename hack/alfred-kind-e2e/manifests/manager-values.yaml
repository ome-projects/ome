global:
  hub: ""
  imagePullSecrets: []

ome:
  multiclusterAccess:
    enabled: false
  multicluster:
    enabled: false
  controller:
    replicaCount: 1
    # The manager accepts RawDeployment as the cluster default; the acceptance
    # fixture opts into OMENative explicitly on its InferenceService.
    deploymentMode: RawDeployment
    image: alfred-e2e/manager
    tag: local
    nodeSelector:
      alfred-e2e/infrastructure: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    # Only the tpu-defrag fixture's virtual TPU nodes carry the provisionOnly
    # label, so no other fixture is provisioned a slice.
    tpuSliceProvisioning:
      chipResource: google.com/tpu
      nodeLabels:
        accelerator: cloud.google.com/gke-tpu-accelerator
        topology: cloud.google.com/gke-tpu-topology
        slice: cloud.google.com/gke-tpu-slice
      provisionOnly:
        key: cloud.google.com/gke-accelerator-topology-mode
        value: PROVISION_ONLY
      accelerators:
        tpu7x:
          sliceType: tpu7x
          chipsPerHost: 4
          topologies: ["2x2x1"]
      slice:
        ownerKindLabel: cloud.google.com/slice-owner-kind
        ownerNameLabel: cloud.google.com/slice-owner-name
        annotations: {}
        readyStates: [ACTIVE]

modelAgent:
  enabled: false

prometheus:
  enabled: false

prometheusRule:
  enabled: false

podMonitor:
  enabled: false
