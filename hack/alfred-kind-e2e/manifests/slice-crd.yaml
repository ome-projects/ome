# A minimal stand-in for GKE's accelerator.gke.io Slice CRD: only the fields
# OME's slice provisioner writes and reads. slice-provider fulfills it on the
# virtual TPU nodes.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: slices.accelerator.gke.io
spec:
  group: accelerator.gke.io
  scope: Cluster
  names:
    kind: Slice
    listKind: SliceList
    plural: slices
    singular: slice
  versions:
  - name: v1beta1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [type, topology, partitionIds]
            properties:
              type:
                type: string
              topology:
                type: string
              partitionIds:
                type: array
                items:
                  type: string
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
